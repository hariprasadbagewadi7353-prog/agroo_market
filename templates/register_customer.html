<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#eef2ea;
            overflow-x:hidden;
        }

        /* Navbar */

        .navbar{
            background:#3f8f3f;
            padding:18px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            color:white;
            font-size:22px;
            font-weight:bold;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .menu a{
            color:white;
            text-decoration:none;
            font-size:16px;
        }

        .menu a:hover{
            text-decoration:underline;
        }

        /* Main Section */

        .main{
            min-height:calc(100vh - 80px);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        /* Form Section */

        .right{
            width:420px;
        }

        .right h1{
            color:#2e7d32;
            font-size:55px;
            margin-bottom:10px;
            text-align:center;
        }

        .right p{
            color:#555;
            margin-bottom:30px;
            font-size:20px;
            text-align:center;
            line-height:30px;
        }

        .form-box{
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box input{
            width:100%;
            padding:15px;
            border:1px solid #ccc;
            border-radius:12px;
            font-size:16px;
            outline:none;
            transition:0.3s;
        }

        .input-box input:focus{
            border-color:#2e7d32;
            box-shadow:0 0 8px rgba(46,125,50,0.3);
        }

        .btn{
            width:100%;
            padding:15px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:35px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            font-weight:bold;
        }

        .btn:hover{
            background:#1b5e20;
            transform:scale(1.02);
        }

        .login-link{
            text-align:center;
            margin-top:18px;
            font-size:16px;
        }

        .login-link a{
            color:#2e7d32;
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <div class="logo">
        🌾 Agro Marketplace
    </div>

    <div class="menu">
        <a href="/">Home</a>
        
    </div>

</div>

<!-- Main Section -->

<div class="main">

    <div class="right">

        <h1>Join Us</h1>

        <p>
            Create your customer account and buy fresh products directly from farmers.
        </p>
       

        <div class="form-box">

            <form action="/register_customer" method="POST">

                <div class="input-box">
                    <input type="text"
                           name="name"
                           placeholder="Full Name"
                           required>
                </div>

                <div class="input-box">
                    <input type="text"
                           name="contact"
                           placeholder="Contact Number"
                           required>
                </div>

                <div class="input-box">
                    <input type="text"
                           name="location"
                           placeholder="Location"
                           required>
                </div>

                <div class="input-box">
                    <input type="text"
                           name="pincode"
                           placeholder="Pincode"
                           required>
                </div>

                <div class="input-box">
                    <input type="text"
                           name="username"
                           placeholder="Username"
                           required>
                </div>

                <div class="input-box">
                    <input type="password"
                           name="password"
                           placeholder="Password"
                           required>
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="/login_customer">
                    Login
                </a>
            </div>

        </div>

    </div>

</div>

<!-- Flash Message -->

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <script>
            alert("{{ messages[0] }}");
        </script>
    {% endif %}
{% endwith %}

</body>
</html>
