<!DOCTYPE html>
<html>
<head>

    <title>Add Government Scheme</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#edf2e8;
        }

        /* NAVBAR */

        .navbar{
            background:#3f8f3f;
            padding:20px 60px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .menu a{
            color:white;
            text-decoration:none;
            margin-left:25px;
            font-size:18px;
            transition:0.3s;
        }

        .menu a:hover{
            color:#d4ffd4;
        }

        /* MAIN SECTION */

        .main{

            min-height:90vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:50px;
        }

        .container{

            width:100%;
            max-width:1200px;

            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:60px;
        }

        /* LEFT SIDE */

        .left{
            flex:1;
            text-align:center;
        }
.left img{
    width:100%;
    max-width:550px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-15px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        /* RIGHT SIDE */

        .right{
            flex:1;
        }

        .right h1{
            font-size:70px;
            color:#2e7d32;
            margin-bottom:15px;
        }

        .right p{
            font-size:24px;
            color:#555;
            margin-bottom:35px;
            line-height:35px;
        }

        /* FORM BOX */

        .form-box{

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:0 8px 25px rgba(0,0,0,0.12);
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input,
        .input-box textarea{

            width:100%;

            padding:16px;

            border:1px solid #ccc;

            border-radius:12px;

            outline:none;

            font-size:16px;
        }

        .input-box textarea{
            height:120px;
            resize:none;
        }

        .input-box input:focus,
        .input-box textarea:focus{

            border:1px solid #2e7d32;

            box-shadow:0 0 8px rgba(46,125,50,0.3);
        }

        .file-label{
            font-weight:bold;
            color:#2e7d32;
            margin-bottom:8px;
            display:block;
        }

        /* BUTTON */

        .btn{

            width:100%;

            background:#2e7d32;

            color:white;

            border:none;

            padding:16px;

            font-size:20px;

            border-radius:40px;

            cursor:pointer;

            transition:0.3s;
        }

        .btn:hover{

            background:#1b5e20;

            transform:scale(1.02);
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .container{
                flex-direction:column;
            }

            .right h1{
                font-size:45px;
                text-align:center;
            }

            .right p{
                text-align:center;
                font-size:20px;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        🌾 Agro Marketplace
    </div>

    <div class="menu">

        <a href="/">Home</a>
        <a href="/admin_dashboard">Dashboard</a>
        <a href="/show_schemes">Schemes</a>
        <a href="/logout">Logout</a>

    </div>

</div>

<!-- MAIN -->

<div class="main">
<!-- LEFT IMAGE -->

<div class="left">
<img src="{{ url_for('static', filename='image/gov_scheme.png') }}">
</div>
        <!-- RIGHT CONTENT -->

        <div class="right">

            <h1>Add Scheme</h1>

            <p>
                Upload government schemes, farmer benefits,
                subsidies and awareness programs.
            </p>

            <!-- FORM -->

            <div class="form-box">

                <form method="POST" enctype="multipart/form-data">

                    <!-- TITLE -->

                    <div class="input-box">

                        <input type="text"
                               name="title"
                               placeholder="Scheme Title"
                               required>

                    </div>

                    <!-- DESCRIPTION -->

                    <div class="input-box">

                        <textarea name="description"
                                  placeholder="Scheme Description"
                                  required></textarea>

                    </div>

                    <!-- IMAGE -->

                    <div class="input-box">

                        <label class="file-label">
                            Upload Scheme Image
                        </label>

                        <input type="file"
                               name="image"
                               required>

                    </div>

                    <!-- VIDEO -->

                    <div class="input-box">

                        <label class="file-label">
                            Upload Scheme Video
                        </label>

                        <input type="file"
                               name="video">

                    </div>

                    <!-- BUTTON -->

                    <button type="submit" class="btn">
                        Add Scheme
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- FLASH MESSAGE -->

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <script>
            alert("{{ messages[0] }}");
        </script>
    {% endif %}
{% endwith %}

</body>
</html>
